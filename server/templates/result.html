{% extends "template.html" %}
{% block content %}
<h4 style="color:white;flex:5">showing results for "{{ query }}"</h4>
<div id="resultcontent">
{% for link in links %}
    <div id="videobox">
        <iframe id="video" width="560" height="315" src={{ "https://www.youtube.com/embed/"+link }} title="YouTube video player" frameborder="0" allow="accelerometer; autoplay; clipboard-write; encrypted-media; gyroscope; picture-in-picture; web-share" allowfullscreen></iframe>
    </div>
{% endfor %}
</div>
<div id="PScontainer">
    {% if previous_page_token!=None %}
    <button><a href="/main/result?q={{ query }}&pageToken={{ previous_page_token }}">Prev</a></button>
    {% endif %}
    {% if next_page_token!=None %}
    <button><a href="/main/result?q={{ query }}&pageToken={{ next_page_token }}">Next</a></button>
    {% endif %}
</div>
{% endblock content %}
